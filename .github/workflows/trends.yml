name: رصد الترندات

# الترندات تموت خلال ساعات، تشغيل كل 60 دقيقة لتوفير الرصيد والاستهلاك.
#
# ملاحظة: تشغيل كل 60 دقيقة (عند الدقيقة 15 لتفادي زحام السيرفرات)
# يخفض الاستهلاك بنسبة 60% ويوفر رصيد استدعاءات الذكاء الاصطناعي لكتابة المقالات.
on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

# يمنع تشغيلتين متزامنتين من الكتابة فوق بعضهما
concurrency:
  group: trends
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Pillow للكروت، و anthropic للكتابة. نسيان الثانية جعل كل
      # تشغيلة تلتقط وتصنّف ثم تخرج بصفر مقالات، والخطأ مكتوم لأن
      # خطوة الكتابة تحمل continue-on-error.
      - name: تثبيت المتطلبات
        run: pip install --quiet Pillow anthropic google-auth requests requests-oauthlib arabic-reshaper python-bidi

      # تثبيت خطوط عربية إضافية كاحتياط بجانب خطوط Tahoma المدمجة في engine/fonts
      - name: تثبيت خط عربي
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-core fonts-kacst

      - name: التقاط وإثراء وتصنيف
        run: python engine/pipeline.py

      - name: كتابة الشروح
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # لا توقف التشغيلة كلها لو تعذّرت الكتابة — البيانات أهم
        continue-on-error: true
        run: python engine/writer.py

      # صور المقالات: ما لم تُختر صورته، أو اختيرت بقواعد أقدم (photos.py).
      # محدودة بتسعين ثانية لأن التشغيلة كلها ثماني دقائق، والباقي يكمل في
      # التشغيلة التالية. فشلها لا يُسقط التشغيلة: الموقع يعرض الكارت مكانها.
      - name: صور المقالات
        continue-on-error: true
        run: python engine/photos.py --budget 90

      # رسوم توضيحية بالذكاء الاصطناعي (aiart.py) تحل محل الصور التعبيرية
      # العامة. بلا مفاتيح Cloudflare تخرج بلا خطأ، وفشلها لا يُسقط التشغيلة.
      - name: رسوم المقالات
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SITE_BASE: ${{ vars.SITE_BASE }}
        run: python engine/aiart.py --budget 150 --max 12

      - name: توليد الكروت
        run: python engine/cards.py

      - name: تحديث ذاكرة الكيانات
        run: python engine/entities.py

      - name: توليد لوحة المحرّك
        run: python engine/render.py

      # النطاق يُمرَّر كمتغيّر: قبل حجزه يبني على عنوان Cloudflare
      # المجاني، وبعده تُغيَّر القيمة مرة واحدة هنا فقط.
      - name: بناء الموقع
        id: build
        env:
          SITE_BASE: ${{ vars.SITE_BASE }}
        run: python engine/site.py "${SITE_BASE:-https://altrendat.com}"

      # حارس السياسات: أي مخالفة (وظيفة بلا إعلان رسمي، تقييم مكتوب، مصدر
      # بث مقرصن، عنوان مبالغ فيه...) توقف نشر الصفحات، فيبقى آخر موقع سليم
      # منشورًا. بلا continue-on-error عمدًا. والبيانات تُحفظ رغم ذلك (خطوة الحفظ).
      - name: حارس السياسات
        id: guard
        run: python engine/guard.py

      # الفهرسة تحسين لا شرط — فشلها لا يُسقط التشغيلة
      - name: إخطار محركات البحث (IndexNow)
        env:
          SITE_BASE: ${{ vars.SITE_BASE }}
        continue-on-error: true
        run: python engine/indexnow.py "${SITE_BASE:-https://altrendat.com}"

      # Indexing API لصفحات الوظائف الحقيقية وحدها (شرط جوجل) — انظر google_indexer.py
      - name: إخطار Google Indexing API
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SITE_BASE: ${{ vars.SITE_BASE }}
        continue-on-error: true
        run: python engine/google_indexer.py "${SITE_BASE:-https://altrendat.com}"

      # النشر التلقائي على منصة X (تويتر) فور ظهور الترند لجلب زيارات لحظية
      - name: النشر التلقائي على X (تويتر)
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          SITE_BASE: ${{ vars.SITE_BASE }}
        continue-on-error: true
        run: python engine/poster_x.py "${SITE_BASE:-https://altrendat.com}"

      # النشر التلقائي على تليجرام (مجاني 100% وبدون أي قيود أو رسوم)
      - name: النشر التلقائي على تليجرام
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_BASE: ${{ vars.SITE_BASE }}
        continue-on-error: true
        run: python engine/poster_telegram.py "${SITE_BASE:-https://altrendat.com}"

      # إشعارات OneSignal تُرسل مركزياً كل 6 ساعات عبر مستودع gold-news-bot لمنع التكرار والإزعاج
      # - name: إرسال إشعارات لتطبيق Goldex (OneSignal)
      #   env:
      #     ONESIGNAL_APP_ID: "a624b9fa-0c01-46de-a5c2-99e05d1a5bb5"
      #     ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
      #     SITE_BASE: ${{ vars.SITE_BASE }}
      #   continue-on-error: true
      #   run: python engine/poster_onesignal.py "${SITE_BASE:-https://altrendat.com}"

      # دفعة من أداة أخرى أثناء التشغيلة (تعديل كود وصفحات مبنية مثلًا) كانت
      # تُسقط الحفظ كله فتضيع مقالات دُفع ثمنها. نعيد التأسيس على أحدث نسخة ثم
      # ندفع، حتى ثلاث مرات. وعند تعارض الأسطر نأخذ نسخة هذه التشغيلة
      # (-X theirs = التزام التشغيلة أثناء إعادة التأسيس): صفحات site/ تُبنى من
      # جديد في كل تشغيلة، فالتشغيلة التالية تبنيها بأحدث كود على أي حال.
      # يعمل حتى لو أوقف الحارس النشر: المقالات المكتوبة (data/) مدفوعة الثمن،
      # وضياعها يعني كتابتها ودفع ثمنها مرة أخرى في التشغيلة التالية. أما صفحات
      # site/ فلا تُحفظ إلا إن وافق الحارس، فيبقى آخر موقع سليم منشورًا.
      - name: حفظ النتائج
        if: always() && steps.build.outcome == 'success'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ "${{ steps.guard.outcome }}" = "success" ]; then
            git add data/ output/ site/
            msg="رصد: $(date -u '+%Y-%m-%d %H:%M') UTC"
          else
            git add data/ output/
            # صفحات هذه التشغيلة مرفوضة: تُعاد لآخر نسخة منشورة (ولولا ذلك
            # لتعذّر pull --rebase بسبب ملفات معدّلة غير محفوظة)
            git checkout -- site/ && git clean -fdq -- site/
            msg="رصد (بيانات فقط، الحارس أوقف نشر الصفحات): $(date -u '+%Y-%m-%d %H:%M') UTC"
          fi
          git diff --staged --quiet && exit 0
          git commit -q -m "$msg"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase -X theirs -q origin master || { git rebase --abort; exit 1; }
          done
          exit 1
