name: رصد الترندات

# الترندات تموت خلال ساعات، لذلك كل 20 دقيقة وليس كل 3 ساعات.
#
# ملاحظة مهمة: هذا يعني ~2160 تشغيلة شهريًا، وهو أكثر من 2000 دقيقة
# المجانية في المستودعات الخاصة. اجعل المستودع عامًا (دقائق غير محدودة)
# أو ارفع الفاصل إلى 30 دقيقة. ولا تضع أي مفتاح في الكود — كلها Secrets.
on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

# يمنع تشغيلتين متزامنتين من الكتابة فوق بعضهما
concurrency:
  group: trends
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Pillow للكروت، و anthropic للكتابة. نسيان الثانية جعل كل
      # تشغيلة تلتقط وتصنّف ثم تخرج بصفر مقالات، والخطأ مكتوم لأن
      # خطوة الكتابة تحمل continue-on-error.
      - name: تثبيت المتطلبات
        run: pip install --quiet Pillow anthropic google-auth

      # خادم Ubuntu لا يملك خطًا عربيًا افتراضيًا، فالكروت تخرج مربعات
      # فارغة أو يفشل التوليد. Noto يغطي العربية كاملة.
      - name: تثبيت خط عربي
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-core

      - name: التقاط وإثراء وتصنيف
        run: python engine/pipeline.py

      - name: كتابة الشروح
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # لا توقف التشغيلة كلها لو تعذّرت الكتابة — البيانات أهم
        continue-on-error: true
        run: python engine/writer.py

      - name: توليد الكروت
        run: python engine/cards.py

      - name: تحديث ذاكرة الكيانات
        run: python engine/entities.py

      - name: توليد لوحة المحرّك
        run: python engine/render.py

      # النطاق يُمرَّر كمتغيّر: قبل حجزه يبني على عنوان Cloudflare
      # المجاني، وبعده تُغيَّر القيمة مرة واحدة هنا فقط.
      - name: بناء الموقع
        env:
          SITE_BASE: ${{ vars.SITE_BASE }}
        run: python engine/site.py "${SITE_BASE:-https://altrendat.com}"

      # الفهرسة تحسين لا شرط — فشلها لا يُسقط التشغيلة
      - name: إخطار محركات البحث (IndexNow)
        env:
          SITE_BASE: ${{ vars.SITE_BASE }}
        continue-on-error: true
        run: python engine/indexnow.py "${SITE_BASE:-https://altrendat.com}"

      # إشعار Googlebot لحظياً بأحدث المقالات لسرعة الفهرسة
      - name: إخطار Google Indexing API
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SITE_BASE: ${{ vars.SITE_BASE }}
        continue-on-error: true
        run: python engine/google_indexer.py "${SITE_BASE:-https://altrendat.com}"

      - name: حفظ النتائج
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ output/ site/
          git diff --staged --quiet || git commit -m "رصد: $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push
